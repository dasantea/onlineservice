<main class="sub-main"><section class="sub-hero"><div class="container narrow"><span class="eyebrow">B2B LOGISTICS</span><h1>공정 물류 견적</h1><p>원자재 픽업, 공정 간 이동, 완제품 납품, 설비 운송을 한 번에 요청하세요.</p></div></section>
<section class="section"><div class="container narrow"><form class="form-card" onsubmit="return demoSubmit(event,'물류 견적 요청이 접수되었습니다. 데모 버전입니다.')">
<div class="form-section"><h3>운송 구간</h3><div class="form-grid"><label>출발지<input required placeholder="예: Bắc Ninh"></label><label>도착지<input required placeholder="예: Hà Nội"></label><label>픽업 날짜<input type="date"></label><label>희망 시간<input type="time"></label></div></div>
<div class="form-section"><h3>화물 정보</h3><div class="form-grid"><label>화물 종류<select><option>인쇄물</option><option>원자재</option><option>팔레트</option><option>중고설비</option></select></label><label>예상 중량<input placeholder="예: 850 kg"></label><label>차량<select><option>자동 추천</option><option>500kg</option><option>1톤</option><option>2톤</option><option>5톤</option><option>8톤+</option></select></label><label>차량 형태<select><option>일반 카고</option><option>탑차</option><option>리프트</option><option>크레인</option></select></label></div></div>
<div class="form-section"><h3>부가 서비스</h3><div class="check-grid"><label><input type="checkbox"> 상하차 인력</label><label><input type="checkbox"> 지게차</label><label><input type="checkbox"> 크레인</label><label><input type="checkbox"> 보험</label><label><input type="checkbox"> 설비 해체</label><label><input type="checkbox"> 설치 기술자</label></div></div>
<button class="btn primary wide">물류 견적 받기</button></form></div></section></main><script src="assets/app.js?v=34"></script></body></html>
