<body>

  <div class="container nav-wrap">

      <a class="auth-login" href="account.html">로그인</a>
      <a class="auth-signup" href="account.html#signup">회원가입</a>
    </div>
    
    <div class="language-switcher" data-no-i18n>
  <button class="lang-current" type="button" aria-label="Select language">
    <img id="currentLangFlag" class="lang-flag-img" src="assets/flags/kr.svg" alt="">
    <span id="currentLangLabel">한국어</span>
    <span class="lang-arrow">▾</span>
  </button>
  <div class="lang-menu" role="menu">
    <button type="button" data-lang="ko"><img src="assets/flags/kr.svg" alt=""> 한국어</button>
    <button type="button" data-lang="vi"><img src="assets/flags/vn.svg" alt=""> Tiếng Việt</button>
    <button type="button" data-lang="zh"><img src="assets/flags/cn.svg" alt=""> 中文</button>
    <button type="button" data-lang="en"><img src="assets/flags/us.svg" alt=""> English</button>
  </div>
</div>
    <button class="mobile-toggle" aria-label="메뉴 열기">☰</button>
  </div>
</header>
<main class="sub-main">
<section class="sub-hero"><div class="container narrow"><span class="eyebrow">RFQ</span><h1>외주 견적 요청</h1><p>한 번의 요청으로 적합한 인쇄·후공정 업체의 견적을 비교하세요.</p></div></section>
<section class="section"><div class="container narrow">
<form class="form-card" onsubmit="return demoSubmit(event,'견적 요청이 접수되었습니다. 데모 버전에서는 실제 전송되지 않습니다.')">
  <div class="form-section"><h3>1. 기본 작업정보</h3><div class="form-grid">
    <label>제품명<input required placeholder="예: 화장품 단상자"></label>
    <label>희망 납기<input type="date" required></label>
    <label>규격<input placeholder="예: 300 × 450 mm"></label>
    <label>수량<input type="number" placeholder="예: 50000"></label>
    <label>재질<input placeholder="예: 350g Ivory"></label>
    <label>납품지역<input placeholder="예: Bắc Ninh"></label>
  </div></div>
  <div class="form-section"><h3>2. 필요한 공정</h3><div class="check-grid">
    <label><input type="checkbox"> 옵셋인쇄</label><label><input type="checkbox"> 라미네이팅</label><label><input type="checkbox"> UV 코팅</label><label><input type="checkbox"> 금박/은박</label><label><input type="checkbox"> 톰슨/도무송</label><label><input type="checkbox"> 접착/제함</label><label><input type="checkbox"> 제본</label><label><input type="checkbox"> 검수/포장</label>
  </div></div>
  <div class="form-section"><h3>3. 물류 포함 여부</h3><div class="radio-row"><label><input type="radio" name="logi" checked> 물류 포함 견적</label><label><input type="radio" name="logi"> 가공비만 견적</label></div></div>
  <div class="form-section"><h3>4. 상세 요청사항</h3><textarea rows="6" placeholder="공정조건, 품질기준, 포장방법 등 필요한 내용을 입력하세요."></textarea><label class="file-box">도면/샘플/작업지시서 첨부<input type="file" multiple></label></div>
  <button class="btn primary wide" type="submit">무료 견적 요청하기</button>
</form></div></section></main>
<script src="assets/app.js?v=70"></script></body></html>
