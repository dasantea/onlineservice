<tr><td>RFQ-240821</td><td>식품 패키지 슬리브</td><td>라미네이팅 · 톰슨</td><td>4건</td><td><span class="demo-badge blue">비교 가능</span></td></tr>
</tbody></table><div class="demo-actions"><a class="demo-btn" href="rfq-create.html">새 견적 등록</a><a class="demo-btn secondary" href="quote-compare.html">견적 비교</a></div></div>
<script>document.addEventListener('DOMContentLoaded',()=>{const s=OTQDemo.getState(),b=document.getElementById('rfqRows');s.rfqs.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r.id}</td><td>${r.product} ${r.qty}</td><td>${r.process}</td><td>0건</td><td><span class="demo-badge green">${r.status}</span></td>`;b.prepend(tr)})});</script>
